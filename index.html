<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>샤홍 단어장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EF; --paper-deep:#F2EBDD;
    --ink:#2B2620; --ink-soft:#7A7267; --ink-faint:#B3AA9C;
    --red:#DD3F26; --red-deep:#AE2C18; --red-tint:#FBE7E1;
    --sage:#6F7D52; --sage-tint:#EAEEDF;
    --line:#E4DBC9; --white:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;}
  .zh{font-family:'Noto Serif SC',serif;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);
    display:flex;flex-direction:column;}

  header{padding:26px 20px 0;border-bottom:1px solid var(--line);}
  header .brand{display:flex;align-items:baseline;gap:8px;}
  header .mark{font-family:'Noto Serif SC',serif;font-weight:700;font-size:22px;color:var(--red);line-height:1;}
  header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  header p.tag{margin:4px 0 16px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}

  nav.tabs{display:flex;gap:2px;}
  nav.tabs button{flex:1;background:none;border:none;padding:11px 2px 13px;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-faint);
    cursor:pointer;border-bottom:2px solid transparent;transition:color .15s;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--red);}
  nav.tabs .badge{display:inline-block;margin-left:3px;background:var(--red);color:#fff;
    font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;vertical-align:2px;}

  main{flex:1;padding:20px 20px 90px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;font-weight:700;border-radius:2px;cursor:pointer;border:none;}
  .btn-primary{background:var(--red);color:#fff;padding:13px 20px;font-size:14px;width:100%;}
  .btn-primary:active{background:var(--red-deep);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);
    padding:9px 14px;font-size:13px;}

  .clip-btn{width:100%;padding:15px;margin-bottom:16px;border:1px dashed var(--red);
    background:var(--red-tint);color:var(--red-deep);border-radius:2px;
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
  .clip-btn:active{background:#F7D9D1;}
  .empty{text-align:center;padding:54px 20px;color:var(--ink-soft);}
  .empty .glyph{font-size:30px;margin-bottom:12px;font-family:'Noto Serif SC',serif;color:var(--ink-faint);}
  .empty p{font-size:13.5px;line-height:1.65;margin:0;}

  .banner{margin-bottom:14px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.55;}
  .banner-ok{background:var(--sage-tint);border-left:3px solid var(--sage);color:var(--sage);}
  .banner-err{background:var(--red-tint);border-left:3px solid var(--red);color:var(--red-deep);
    font-weight:400;font-size:12px;word-break:break-all;}

  /* history */
  .hist-card{border:1px solid var(--line);border-left:3px solid var(--red);background:var(--white);
    padding:14px 15px;margin-bottom:9px;border-radius:2px;cursor:pointer;}
  .hist-card:active{background:var(--paper-deep);}
  .hist-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px;}
  .hist-date{font-size:11.5px;color:var(--ink-faint);font-weight:600;flex-shrink:0;}
  .hist-count{font-size:11.5px;color:var(--red);font-weight:700;flex-shrink:0;}
  .hist-preview{font-size:14px;line-height:1.55;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .hist-zh{font-size:13px;color:var(--ink-soft);margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}

  /* detail */
  .back-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-soft);
    font-weight:600;cursor:pointer;margin-bottom:16px;background:none;border:none;font-family:inherit;padding:0;}
  .block{padding:15px 16px;margin-bottom:12px;border-radius:2px;background:var(--paper-deep);
    font-size:14px;line-height:1.75;}
  .block .label{display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft);
    margin-bottom:7px;letter-spacing:.03em;}
  .block-zh{border-left:3px solid var(--red);}
  .block-ko{border-left:3px solid var(--ink);}

  .word-card{border:1px solid var(--line);border-left:3px solid var(--ink-faint);background:var(--white);
    padding:13px 14px;margin-bottom:8px;border-radius:2px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .word-card.saved{border-left-color:var(--sage);}
  .w-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .w-hanzi{font-size:21px;font-weight:600;}
  .w-pinyin{font-size:12.5px;color:var(--red);font-weight:600;}
  .w-mean{font-size:13.5px;margin-top:4px;line-height:1.5;}
  .icon-btn{background:none;border:1px solid var(--line);width:32px;height:32px;border-radius:2px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;}

  .stats{display:flex;padding:14px 10px;background:var(--paper-deep);border-radius:2px;margin-bottom:16px;}
  .stats .s{flex:1;text-align:center;}
  .stats .s b{display:block;font-size:19px;font-weight:700;}
  .stats .s span{font-size:11px;color:var(--ink-soft);}

  .search-in{width:100%;border:1px solid var(--line);background:var(--white);padding:10px 12px;
    font-family:inherit;font-size:14px;border-radius:2px;margin-bottom:14px;}
  .search-in:focus{outline:none;border-color:var(--red);}

  .v-item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);}
  .v-main{flex:1;min-width:0;}
  .v-hanzi{font-size:17px;font-weight:600;}
  .v-pinyin{font-size:12px;color:var(--red);margin-left:7px;font-weight:600;}
  .v-mean{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .dots{display:flex;gap:3px;margin-top:5px;}
  .dots span{width:5px;height:5px;border-radius:50%;background:var(--line);}
  .dots span.on{background:var(--sage);}
  .v-del{background:none;border:none;color:var(--ink-faint);font-size:18px;cursor:pointer;padding:4px 6px;}

  /* flashcard */
  .prog{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);
    font-weight:600;margin-bottom:10px;}
  .track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px;}
  .track div{height:100%;background:var(--red);transition:width .3s;}
  .fcard{min-height:290px;border:1px solid var(--line);background:var(--white);border-radius:2px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:34px 24px;position:relative;cursor:pointer;}
  .fc-hanzi{font-size:40px;font-weight:600;margin-bottom:10px;}
  .fc-pinyin{font-size:15px;color:var(--red);font-weight:600;}
  .fc-speak{margin-top:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
    background:var(--paper-deep);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .fc-hint{position:absolute;bottom:15px;font-size:11px;color:var(--ink-faint);}
  .fc-back{display:none;width:100%;}
  .fcard.flip .fc-front{display:none;}
  .fcard.flip .fc-back{display:block;}
  .fc-mean{font-size:21px;font-weight:700;margin-bottom:8px;}
  .fc-src{font-size:12px;color:var(--ink-soft);line-height:1.6;padding-top:12px;margin-top:12px;
    border-top:1px solid var(--line);}
  .acts{display:flex;gap:10px;margin-top:14px;}
  .acts button{flex:1;padding:15px;border-radius:2px;border:none;font-family:inherit;
    font-size:14px;font-weight:700;cursor:pointer;}
  .b-again{background:var(--red-tint);color:var(--red-deep);}
  .b-know{background:var(--sage);color:#fff;}
  .done{text-align:center;padding:58px 20px;}
  .done .glyph{font-family:'Noto Serif SC',serif;font-size:34px;color:var(--sage);margin-bottom:14px;}
  .done h2{font-size:17px;margin:0 0 8px;}
  .done p{font-size:13px;color:var(--ink-soft);margin:0;}
  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="mark">红</span><h1>샤홍 단어장</h1></div>
    <p class="tag">샤오홍슈에서 뒤로 탭 두 번이면 여기 저장돼요</p>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="history">기록</button>
      <button class="tab-btn" data-tab="vocab">단어장 <span class="badge" id="bVocab" style="display:none">0</span></button>
      <button class="tab-btn" data-tab="study">학습 <span class="badge" id="bStudy" style="display:none">0</span></button>
    </nav>
  </header>
  <main>
    <section class="panel active" id="p-history">
      <div id="importBox">
        <button class="clip-btn" id="clipBtn">📋 복사한 결과 가져오기</button>
        <div id="pasteWrap" style="display:none;">
          <textarea id="pasteIn" placeholder="여기를 길게 눌러 → 붙여넣기"
            style="width:100%;min-height:90px;border:1px solid var(--line);background:var(--white);
            border-radius:2px;padding:12px;font-family:inherit;font-size:14px;line-height:1.5;
            resize:vertical;"></textarea>
          <button class="btn btn-primary" id="pasteGo" style="margin-top:8px;">저장하기</button>
        </div>
      </div>
      <div id="histArea"></div>
    </section>
    <section class="panel" id="p-vocab">
      <div class="stats">
        <div class="s"><b id="stTotal">0</b><span>전체</span></div>
        <div class="s"><b id="stDue">0</b><span>복습 대기</span></div>
        <div class="s"><b id="stMaster">0</b><span>마스터</span></div>
      </div>
      <input class="search-in" id="vSearch" placeholder="단어 검색...">
      <div id="vList"></div>
    </section>
    <section class="panel" id="p-study"><div id="studyArea"></div></section>
  </main>
</div>

<script>
const K_VOCAB='vocab-cards', K_HIST='capture-history';
let vocab=[], history_=[], detailId=null;
let queue=[], qIdx=0, qDone=0, studyScope=null;

/* ---------- storage ---------- */
function load(){
  try{ vocab=JSON.parse(localStorage.getItem(K_VOCAB)||'[]'); }catch(e){ vocab=[]; }
  try{ history_=JSON.parse(localStorage.getItem(K_HIST)||'[]'); }catch(e){ history_=[]; }
}
function saveVocab(){ try{ localStorage.setItem(K_VOCAB,JSON.stringify(vocab)); }catch(e){} }
function saveHist(){ try{ localStorage.setItem(K_HIST,JSON.stringify(history_)); }catch(e){} }

/* ---------- leitner ---------- */
const IV=[0,1,2,4,7,14];
const isDue=c=>c.nextReview<=Date.now();
function mark(c,ok){
  c.box = ok ? Math.min(c.box+1,5) : 0;
  c.nextReview = Date.now() + IV[c.box]*864e5;
}

/* ---------- utils ---------- */
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtDate(ts){
  const d=new Date(ts), n=new Date();
  const sameDay = d.toDateString()===n.toDateString();
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  if(sameDay) return `오늘 ${hh}:${mm}`;
  const y=new Date(n-864e5);
  if(d.toDateString()===y.toDateString()) return `어제 ${hh}:${mm}`;
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${hh}:${mm}`;
}
function speak(t){
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.9; speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- parser ---------- */
function section(txt,label){
  const m=txt.match(new RegExp('###\\s*'+label+'\\s*\\n+([\\s\\S]*?)(?=\\n###|$)'));
  return m?m[1].trim():'';
}
function parseResult(raw){
  let text=raw;
  try{ const o=JSON.parse(raw);
    if(o&&o.content&&o.content[0]&&o.content[0].text) text=o.content[0].text;
  }catch(e){}
  text=text.replace(/\\n/g,'\n').replace(/\\\//g,'/');

  const zh=section(text,'原文')||section(text,'원문');
  const ko=section(text,'번역')||section(text,'翻译');
  const wordBlock=section(text,'단어')||section(text,'词汇')||text;

  const words=[], seen=new Set();
  for(const ln of wordBlock.split(/\r?\n/)){
    const line=ln.trim(); if(line.length<2) continue;
    const parts=(line.includes('|')?line.split('|'):line.split('/'))
      .map(p=>p.trim()).filter(Boolean);
    if(parts.length<3) continue;
    const hanzi=parts[0], mean=parts[parts.length-1], pin=parts.slice(1,-1).join(' ');
    if(!/[\u4e00-\u9fff]/.test(hanzi)) continue;
    if(/[\u4e00-\u9fff\uac00-\ud7a3]/.test(pin)) continue;
    if(!pin||!mean||seen.has(hanzi)) continue;
    seen.add(hanzi); words.push({hanzi,pinyin:pin,meaning:mean});
  }
  return {zh,ko,words};
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>go(b.dataset.tab));
});
function go(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+tab).classList.add('active');
  if(tab==='history'){ detailId=null; renderHist(); }
  if(tab==='vocab') renderVocab();
  if(tab==='study'){ studyScope=null; startStudy(); }
  window.scrollTo(0,0);
}
function badges(){
  const bv=document.getElementById('bVocab'), bs=document.getElementById('bStudy');
  const due=vocab.filter(isDue).length;
  bv.style.display=vocab.length?'inline-block':'none'; bv.textContent=vocab.length;
  bs.style.display=due?'inline-block':'none'; bs.textContent=due;
}

/* ---------- history ---------- */
function renderHist(banner){
  const el=document.getElementById('histArea');
  if(detailId) return renderDetail();
  let h = banner||'';
  if(!history_.length){
    el.innerHTML=h+`<div class="empty"><div class="glyph">红</div>
      <p>아직 기록이 없어요.<br>샤오홍슈에서 <b>뒤로 탭 두 번</b> 후<br>위 버튼을 눌러주세요.</p></div>`;
    return;
  }
  h+=history_.slice().sort((a,b)=>b.ts-a.ts).map(it=>`
    <div class="hist-card" data-id="${it.id}">
      <div class="hist-top">
        <span class="hist-date">${fmtDate(it.ts)}</span>
        <span class="hist-count">단어 ${it.words.length}</span>
      </div>
      <div class="hist-preview">${esc(it.ko||'(번역 없음)')}</div>
      ${it.zh?`<div class="hist-zh zh">${esc(it.zh)}</div>`:''}
    </div>`).join('');
  el.innerHTML=h;
  el.querySelectorAll('.hist-card').forEach(c=>{
    c.addEventListener('click',()=>{ detailId=c.dataset.id; renderDetail(); window.scrollTo(0,0); });
  });
}

function renderDetail(){
  const it=history_.find(x=>x.id===detailId);
  if(!it){ detailId=null; return renderHist(); }
  const el=document.getElementById('histArea');
  let h=`<button class="back-link" id="backBtn">← 기록으로</button>
    <div style="font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-bottom:12px;">
      ${fmtDate(it.ts)}</div>`;
  if(it.zh) h+=`<div class="block block-zh"><span class="label">원문</span>
    <span class="zh">${esc(it.zh)}</span></div>`;
  if(it.ko) h+=`<div class="block block-ko"><span class="label">한국어 번역</span>${esc(it.ko)}</div>`;

  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;">
      <span style="font-size:13px;color:var(--ink-soft);font-weight:600;">단어 ${it.words.length}개</span>
    </div>`;
  h+=it.words.map(w=>{
    const saved=vocab.some(v=>v.hanzi===w.hanzi);
    return `<div class="word-card ${saved?'saved':''}">
      <div style="flex:1;min-width:0;">
        <div class="w-row"><span class="w-hanzi zh">${esc(w.hanzi)}</span>
          <span class="w-pinyin">${esc(w.pinyin)}</span></div>
        <div class="w-mean">${esc(w.meaning)}</div>
      </div>
      <button class="icon-btn spk" data-h="${esc(w.hanzi)}">🔊</button>
    </div>`;
  }).join('');
  h+=`<button class="btn btn-primary" id="studyThis" style="margin-top:18px;">
      이 단어들로 학습하기</button>`;
  el.innerHTML=h;

  document.getElementById('backBtn').onclick=()=>{ detailId=null; renderHist(); window.scrollTo(0,0); };
  el.querySelectorAll('.spk').forEach(b=>b.onclick=()=>speak(b.dataset.h));
  document.getElementById('studyThis').onclick=()=>{
    studyScope=it.words.map(w=>w.hanzi);
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab==='study'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('p-study').classList.add('active');
    startStudy(); window.scrollTo(0,0);
  };
}

/* ---------- vocab ---------- */
document.getElementById('vSearch').addEventListener('input',renderVocab);
function renderVocab(){
  const q=document.getElementById('vSearch').value.trim().toLowerCase();
  document.getElementById('stTotal').textContent=vocab.length;
  document.getElementById('stDue').textContent=vocab.filter(isDue).length;
  document.getElementById('stMaster').textContent=vocab.filter(v=>v.box>=5).length;
  const list=vocab.slice().sort((a,b)=>b.addedAt-a.addedAt)
    .filter(v=>!q||v.hanzi.includes(q)||v.pinyin.toLowerCase().includes(q)||v.meaning.toLowerCase().includes(q));
  const el=document.getElementById('vList');
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="glyph">红</div><p>${
      vocab.length?'검색 결과가 없어요.':'아직 단어가 없어요.'}</p></div>`;
    return;
  }
  el.innerHTML=list.map(v=>{
    let d=''; for(let i=0;i<5;i++) d+=`<span class="${i<v.box?'on':''}"></span>`;
    return `<div class="v-item"><div class="v-main">
      <span class="v-hanzi zh">${esc(v.hanzi)}</span><span class="v-pinyin">${esc(v.pinyin)}</span>
      <div class="v-mean">${esc(v.meaning)}</div><div class="dots">${d}</div>
    </div><button class="v-del" data-id="${v.id}">×</button></div>`;
  }).join('');
  el.querySelectorAll('.v-del').forEach(b=>b.onclick=()=>{
    vocab=vocab.filter(v=>v.id!==b.dataset.id); saveVocab(); renderVocab(); badges();
  });
}

/* ---------- study ---------- */
function startStudy(){
  let pool = studyScope ? vocab.filter(v=>studyScope.includes(v.hanzi)) : vocab.filter(isDue);
  queue=pool.sort((a,b)=>a.nextReview-b.nextReview); qIdx=0; qDone=0;
  renderStudy();
}
function renderStudy(){
  const el=document.getElementById('studyArea');
  if(!queue.length){
    el.innerHTML=`<div class="empty"><div class="glyph">红</div>
      <p>${studyScope?'이 기록의 단어가 아직 저장되지 않았어요.':'지금 복습할 단어가 없어요.'}</p></div>`;
    return;
  }
  if(qIdx>=queue.length){
    el.innerHTML=`<div class="done"><div class="glyph">红</div>
      <h2>학습 완료</h2><p>${qDone}개 단어를 복습했어요.</p>
      ${studyScope?'<button class="btn btn-ghost" id="allMode" style="margin-top:18px;">전체 복습으로</button>':''}
      </div>`;
    const am=document.getElementById('allMode');
    if(am) am.onclick=()=>{ studyScope=null; startStudy(); };
    badges(); return;
  }
  const c=queue[qIdx];
  el.innerHTML=`
    <div class="prog"><span>${studyScope?'선택 학습':'복습'}</span><span>${qIdx+1} / ${queue.length}</span></div>
    <div class="track"><div style="width:${qIdx/queue.length*100}%"></div></div>
    <div class="fcard" id="fc">
      <div class="fc-front">
        <div class="fc-hanzi zh">${esc(c.hanzi)}</div>
        <div class="fc-pinyin">${esc(c.pinyin)}</div>
        <div class="fc-speak" id="spk">🔊</div>
        <div class="fc-hint">탭해서 뜻 확인</div>
      </div>
      <div class="fc-back">
        <div class="fc-mean">${esc(c.meaning)}</div>
        ${c.sourceKo?`<div class="fc-src">${esc(c.sourceKo.slice(0,90))}</div>`:''}
      </div>
    </div>
    <div class="acts" id="acts" style="visibility:hidden">
      <button class="b-again" id="bAgain">모르겠어요</button>
      <button class="b-know" id="bKnow">알아요</button>
    </div>`;
  const fc=document.getElementById('fc');
  fc.onclick=e=>{ if(e.target.id==='spk') return;
    fc.classList.add('flip'); document.getElementById('acts').style.visibility='visible'; };
  document.getElementById('spk').onclick=e=>{ e.stopPropagation(); speak(c.hanzi); };
  document.getElementById('bAgain').onclick=()=>submit(c,false);
  document.getElementById('bKnow').onclick=()=>submit(c,true);
}
function submit(c,ok){ mark(c,ok); saveVocab(); qDone++; qIdx++; renderStudy(); }

/* ---------- import ---------- */
function importRaw(raw){
  const p=parseResult(raw);
  if(!p.words.length){
    return `<div class="banner banner-err">단어를 못 읽었어요. 받은 내용: ${esc(raw.slice(0,140))}</div>`;
  }
  const ts=Date.now();
  history_.push({id:'h'+ts,ts,zh:p.zh,ko:p.ko,words:p.words});
  saveHist();
  let added=0;
  p.words.forEach(w=>{
    if(!vocab.some(v=>v.hanzi===w.hanzi)){
      vocab.push({id:ts+'-'+Math.random().toString(36).slice(2,7),
        hanzi:w.hanzi,pinyin:w.pinyin,meaning:w.meaning,
        sourceZh:p.zh,sourceKo:p.ko,box:0,nextReview:ts,addedAt:ts});
      added++;
    }
  });
  if(added) saveVocab();
  badges();
  return `<div class="banner banner-ok">새 기록이 저장됐어요 · 단어 ${p.words.length}개${
    added?` (새 단어 ${added}개)`:''}</div>`;
}

function showPasteBox(msg){
  document.getElementById('clipBtn').style.display='none';
  document.getElementById('pasteWrap').style.display='block';
  document.getElementById('pasteIn').focus();
  if(msg){ detailId=null; renderHist(`<div class="banner banner-err">${esc(msg)}</div>`); }
}
function resetImportBox(){
  document.getElementById('clipBtn').style.display='block';
  document.getElementById('pasteWrap').style.display='none';
  document.getElementById('pasteIn').value='';
}

document.getElementById('clipBtn').addEventListener('click', async ()=>{
  try{
    if(!navigator.clipboard || !navigator.clipboard.readText) throw new Error('no api');
    const txt=await navigator.clipboard.readText();
    if(!txt || !txt.trim()){
      showPasteBox('클립보드를 읽지 못했어요. 아래 칸에 길게 눌러 붙여넣어 주세요.');
      return;
    }
    detailId=null;
    renderHist(importRaw(txt.trim()));
  }catch(e){
    showPasteBox('이 브라우저는 자동 읽기를 막아요. 아래 칸에 길게 눌러 붙여넣어 주세요.');
  }
});

document.getElementById('pasteGo').addEventListener('click', ()=>{
  const t=document.getElementById('pasteIn').value.trim();
  if(!t){ document.getElementById('pasteIn').focus(); return; }
  detailId=null;
  const b=importRaw(t);
  resetImportBox();
  renderHist(b);
  window.scrollTo(0,0);
});

function autoImport(){
  const raw=new URLSearchParams(location.search).get('data');
  if(!raw) return null;
  history.replaceState(null,'',location.pathname);
  return importRaw(raw);
}

/* ---------- init ---------- */
(function(){
  load();
  const banner=autoImport();
  badges();
  renderHist(banner);
})();
</script>
</body>
