<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>샤홍 단어장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EF;
    --paper-deep:#F2EBDD;
    --ink:#2B2620;
    --ink-soft:#7A7267;
    --ink-faint:#B3AA9C;
    --red:#DD3F26;
    --red-deep:#AE2C18;
    --red-tint:#FBE7E1;
    --sage:#6F7D52;
    --sage-tint:#EAEEDF;
    --line:#E4DBC9;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .zh{font-family:'Noto Serif SC',serif;}

  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;position:relative;}

  header{
    padding:28px 20px 0;
    border-bottom:1px solid var(--line);
  }
  header .brand{display:flex;align-items:baseline;gap:8px;}
  header .brand .mark{
    font-family:'Noto Serif SC',serif;
    font-weight:700;
    font-size:22px;
    color:var(--red);
    line-height:1;
  }
  header h1{
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  header p.tag{
    margin:4px 0 18px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  nav.tabs{display:flex;gap:2px;}
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    padding:11px 4px 13px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--ink-faint);
    cursor:pointer;
    position:relative;
    border-bottom:2px solid transparent;
    transition:color .15s ease;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--red);}
  nav.tabs button .badge{
    display:inline-block;margin-left:4px;
    background:var(--red);color:var(--white);
    font-size:10px;font-weight:700;
    border-radius:9px;padding:1px 6px;
    vertical-align:2px;
  }

  main{flex:1;padding:22px 20px 100px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---- Analyze panel ---- */
  textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:2px;
    padding:14px;
    font-family:inherit;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
  }
  textarea:focus{outline:none;border-color:var(--red);}
  textarea::placeholder{color:var(--ink-faint);}

  .primary-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--red);
    color:var(--white);
    border:none;
    padding:13px 20px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border-radius:2px;
    cursor:pointer;
    width:100%;
    margin-top:12px;
    transition:background .15s ease;
  }
  .primary-btn:hover{background:var(--red-deep);}
  .primary-btn:disabled{background:var(--ink-faint);cursor:default;}

  .ghost-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:2px;
    cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--ink-faint);color:var(--ink);}

  .mode-switch{display:flex;gap:6px;margin-bottom:14px;}
  .mode-btn{
    flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--white);
    border-radius:2px;font-family:inherit;font-size:12.5px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;white-space:nowrap;
  }
  .mode-btn.active{border-color:var(--red);color:var(--red);background:var(--red-tint);}

  .upload-zone{
    display:block;border:1px dashed var(--ink-faint);border-radius:2px;
    background:var(--white);min-height:160px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;overflow:hidden;position:relative;
  }
  .upload-zone:active{border-color:var(--red);}
  #uploadEmpty{text-align:center;padding:24px;}
  .upload-icon{font-size:26px;margin-bottom:8px;}
  .upload-text{font-size:13px;color:var(--ink);line-height:1.5;padding:0 10px;}
  .upload-sub{font-size:12px;color:var(--ink-faint);margin-top:6px;}
  #uploadPreview{width:100%;max-height:340px;object-fit:contain;display:block;background:var(--paper-deep);}

  .error-box{
    margin-top:12px;
    padding:12px 14px;
    background:var(--red-tint);
    border-left:3px solid var(--red);
    font-size:13px;
    color:var(--red-deep);
    line-height:1.5;
  }

  .translation-block{
    margin:22px 0 4px;
    padding:16px 16px 16px 18px;
    border-left:3px solid var(--ink);
    background:var(--paper-deep);
    font-size:14px;
    line-height:1.7;
    color:var(--ink);
  }
  .translation-block .label{
    display:block;font-size:11px;font-weight:700;color:var(--ink-soft);
    margin-bottom:6px;letter-spacing:.02em;
  }

  .result-actions{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;}
  .result-actions .count{font-size:13px;color:var(--ink-soft);font-weight:600;}

  .word-card{
    border:1px solid var(--line);
    border-left:3px solid var(--ink-faint);
    background:var(--white);
    padding:14px 14px 14px 16px;
    margin-bottom:8px;
    border-radius:2px;
  }
  .word-card.added{border-left-color:var(--sage);}
  .word-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .word-hanzi-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .word-hanzi{font-size:22px;font-weight:600;}
  .word-pinyin{font-size:13px;color:var(--red);font-weight:600;}
  .word-meaning{font-size:14px;color:var(--ink);margin-top:5px;line-height:1.5;}
  .word-note{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}

  .icon-btn{
    background:none;border:1px solid var(--line);
    width:32px;height:32px;border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;color:var(--ink-soft);
    font-size:14px;
  }
  .icon-btn:hover{border-color:var(--ink-faint);}
  .word-controls{display:flex;gap:6px;flex-shrink:0;}
  .add-btn{
    font-size:12px;font-weight:700;
    padding:0 12px;height:32px;
    border-radius:2px;border:1px solid var(--red);
    background:var(--white);color:var(--red);
    cursor:pointer;white-space:nowrap;
  }
  .add-btn.added{background:var(--sage);border-color:var(--sage);color:var(--white);}

  .empty-state{
    text-align:center;padding:56px 20px 20px;color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:30px;margin-bottom:12px;font-family:'Noto Serif SC',serif;color:var(--ink-faint);}
  .empty-state p{font-size:14px;line-height:1.6;margin:0;}

  /* ---- Vocab list panel ---- */
  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  .search-row input{
    flex:1;border:1px solid var(--line);background:var(--white);
    padding:10px 12px;font-family:inherit;font-size:14px;border-radius:2px;
  }
  .search-row input:focus{outline:none;border-color:var(--red);}

  .stats-row{
    display:flex;justify-content:space-between;
    padding:14px 16px;background:var(--paper-deep);
    border-radius:2px;margin-bottom:16px;
  }
  .stats-row .stat{text-align:center;flex:1;}
  .stats-row .stat b{display:block;font-size:19px;font-weight:700;}
  .stats-row .stat span{font-size:11px;color:var(--ink-soft);}

  .vocab-item{
    display:flex;align-items:center;gap:12px;
    padding:13px 4px;border-bottom:1px solid var(--line);
  }
  .vocab-item .vi-main{flex:1;min-width:0;}
  .vocab-item .vi-hanzi{font-size:17px;font-weight:600;}
  .vocab-item .vi-pinyin{font-size:12px;color:var(--red);margin-left:8px;font-weight:600;}
  .vocab-item .vi-meaning{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .box-dots{display:flex;gap:3px;margin-top:5px;}
  .box-dots span{width:5px;height:5px;border-radius:50%;background:var(--line);}
  .box-dots span.filled{background:var(--sage);}
  .vi-del{background:none;border:none;color:var(--ink-faint);font-size:18px;cursor:pointer;padding:4px 6px;}
  .vi-del:hover{color:var(--red);}

  /* ---- Review panel ---- */
  .review-progress{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:18px;font-size:12px;color:var(--ink-soft);font-weight:600;
  }
  .review-track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px;}
  .review-track div{height:100%;background:var(--red);transition:width .3s ease;}

  .flashcard{
    min-height:280px;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:2px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:36px 24px;position:relative;
    cursor:pointer;
  }
  .flashcard .fc-hanzi{font-size:38px;font-weight:600;margin-bottom:10px;}
  .flashcard .fc-pinyin{font-size:15px;color:var(--red);font-weight:600;}
  .flashcard .fc-speak{
    margin-top:16px;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--line);background:var(--paper-deep);
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
  }
  .flashcard .fc-hint{
    position:absolute;bottom:16px;font-size:11px;color:var(--ink-faint);
  }
  .flashcard .fc-back{display:none;width:100%;}
  .flashcard.flipped .fc-front{display:none;}
  .flashcard.flipped .fc-back{display:block;}
  .fc-meaning{font-size:19px;font-weight:700;margin-bottom:10px;}
  .fc-source{
    font-size:12px;color:var(--ink-soft);line-height:1.6;
    padding-top:12px;margin-top:12px;border-top:1px solid var(--line);
  }

  .review-actions{display:flex;gap:10px;margin-top:16px;}
  .review-actions button{
    flex:1;padding:15px;border-radius:2px;border:none;
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
  }
  .btn-again{background:var(--red-tint);color:var(--red-deep);}
  .btn-know{background:var(--sage);color:var(--white);}

  .done-screen{text-align:center;padding:60px 20px 20px;}
  .done-screen .glyph{font-family:'Noto Serif SC',serif;font-size:34px;color:var(--sage);margin-bottom:14px;}
  .done-screen h2{font-size:17px;margin:0 0 8px;}
  .done-screen p{font-size:13px;color:var(--ink-soft);}

  .loading-dots{display:inline-flex;gap:4px;}
  .loading-dots span{width:5px;height:5px;background:var(--white);border-radius:50%;animation:blink 1.2s infinite ease-in-out;}
  .loading-dots span:nth-child(2){animation-delay:.15s;}
  .loading-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="mark">红</span><h1>샤홍 단어장</h1></div>
    <p class="tag">샤오홍슈에서 본 문장을 붙여넣으면 단어를 갈라줘요</p>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="analyze">분석</button>
      <button class="tab-btn" data-tab="vocab">단어장 <span class="badge" id="vocabBadge" style="display:none;">0</span></button>
      <button class="tab-btn" data-tab="review">복습 <span class="badge" id="reviewBadge" style="display:none;">0</span></button>
    </nav>
  </header>

  <main>
    <!-- ANALYZE -->
    <section class="panel active" id="panel-analyze">
      <div class="mode-switch">
        <button class="mode-btn" data-mode="image" id="modeImageBtn">스크린샷</button>
        <button class="mode-btn" data-mode="text" id="modeTextBtn">텍스트</button>
        <button class="mode-btn active" data-mode="paste" id="modePasteBtn">단축어 결과</button>
      </div>
      <div id="modeHostNote" style="display:none;font-size:11.5px;color:var(--ink-faint);margin:-6px 0 12px;line-height:1.5;">
        ※ 이 두 모드는 Claude 채팅 안에서 열었을 때만 작동해요. 폰에 저장한 버전에서는 "단축어 결과" 탭을 이용하세요.
      </div>

      <div id="modeImage" style="display:none;">
        <label class="upload-zone" id="uploadZone">
          <input type="file" id="imageInput" accept="image/*" hidden>
          <div id="uploadEmpty">
            <div class="upload-icon">📷</div>
            <div class="upload-text">캡션이 보이는 화면을 캡처해서 올려주세요</div>
            <div class="upload-sub">탭해서 사진 선택</div>
          </div>
          <img id="uploadPreview" style="display:none;">
        </label>
        <button class="ghost-btn" id="clearImageBtn" style="display:none;margin-top:8px;">사진 지우기</button>
      </div>

      <div id="modeText" style="display:none;">
        <textarea id="inputText" placeholder="예: 大人感眉毛的关键：自然的毛流感&#10;샤오홍슈 캡션이나 댓글을 그대로 붙여넣으세요"></textarea>
      </div>

      <div id="modePaste">
        <div style="text-align:center;padding:28px 20px;color:var(--ink-soft);">
          <div style="font-size:26px;margin-bottom:10px;font-family:'Noto Serif SC',serif;color:var(--ink-faint);">红</div>
          <p style="font-size:13.5px;line-height:1.6;margin:0;">샤오홍슈에서 <b>뒤로 탭 두 번</b>하면<br>단어가 자동으로 여기 저장돼요.</p>
          <button class="ghost-btn" id="togglePasteBox" style="margin-top:16px;">직접 붙여넣기</button>
        </div>
        <textarea id="inputPaste" style="display:none;" placeholder="단축어 결과를 붙여넣으세요"></textarea>
      </div>

      <button class="primary-btn" id="analyzeBtn" style="display:none;">단어 가져오기</button>
      <div id="analyzeError"></div>
      <div id="analyzeResult"></div>
    </section>

    <!-- VOCAB LIST -->
    <section class="panel" id="panel-vocab">
      <div class="stats-row">
        <div class="stat"><b id="statTotal">0</b><span>전체 단어</span></div>
        <div class="stat"><b id="statDue">0</b><span>복습 대기</span></div>
        <div class="stat"><b id="statMastered">0</b><span>마스터</span></div>
      </div>
      <div class="search-row">
        <input type="text" id="vocabSearch" placeholder="단어 검색...">
      </div>
      <div id="vocabList"></div>
    </section>

    <!-- REVIEW -->
    <section class="panel" id="panel-review">
      <div id="reviewArea"></div>
    </section>
  </main>
</div>

<script>
const STORAGE_KEY = 'vocab-cards';
let vocab = [];
let currentResult = null;
let reviewQueue = [];
let reviewIndex = 0;
let reviewDoneCount = 0;

// ---------- storage (localStorage: works once hosted at a real URL) ----------
async function loadVocab(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    vocab = raw ? JSON.parse(raw) : [];
  }catch(e){
    vocab = [];
  }
}
async function saveVocab(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(vocab));
  }catch(e){
    console.error('저장 실패', e);
  }
}

// ---------- leitner ----------
const INTERVAL_DAYS = [0,1,2,4,7,14];
function isDue(card){ return card.nextReview <= Date.now(); }
function markResult(card, correct){
  if(correct){
    card.box = Math.min(card.box+1, 5);
  }else{
    card.box = 0;
  }
  const days = INTERVAL_DAYS[card.box];
  card.nextReview = Date.now() + days*24*60*60*1000;
  card.reviewedAt = Date.now();
}

// ---------- tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='vocab') renderVocabList();
    if(btn.dataset.tab==='review') startReview();
  });
});

function refreshBadges(){
  const total = vocab.length;
  const due = vocab.filter(isDue).length;
  const vb = document.getElementById('vocabBadge');
  const rb = document.getElementById('reviewBadge');
  vb.style.display = total? 'inline-block':'none';
  vb.textContent = total;
  rb.style.display = due? 'inline-block':'none';
  rb.textContent = due;
}

// ---------- TTS ----------
function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ---------- mode switch ----------
let analyzeMode = 'paste';
let uploadedImage = null; // {base64, mediaType}

document.getElementById('modeImageBtn').addEventListener('click', ()=> switchMode('image'));
document.getElementById('modeTextBtn').addEventListener('click', ()=> switchMode('text'));
document.getElementById('modePasteBtn').addEventListener('click', ()=> switchMode('paste'));

document.getElementById('togglePasteBox').addEventListener('click', ()=>{
  document.getElementById('inputPaste').style.display = 'block';
  document.getElementById('analyzeBtn').style.display = 'flex';
  document.getElementById('togglePasteBox').style.display = 'none';
});

function switchMode(mode){
  analyzeMode = mode;
  document.getElementById('modeImageBtn').classList.toggle('active', mode==='image');
  document.getElementById('modeTextBtn').classList.toggle('active', mode==='text');
  document.getElementById('modePasteBtn').classList.toggle('active', mode==='paste');
  document.getElementById('modeImage').style.display = mode==='image' ? 'block' : 'none';
  document.getElementById('modeText').style.display = mode==='text' ? 'block' : 'none';
  document.getElementById('modePaste').style.display = mode==='paste' ? 'block' : 'none';
  document.getElementById('modeHostNote').style.display = (mode==='image' || mode==='text') ? 'block' : 'none';
  const pasteBoxOpen = document.getElementById('inputPaste').style.display === 'block';
  document.getElementById('analyzeBtn').style.display = (mode==='paste' && !pasteBoxOpen) ? 'none' : 'flex';
  document.getElementById('analyzeBtn').textContent = mode==='paste' ? '단어 가져오기' : '문장 분석하기';
}

document.getElementById('imageInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const dataUrl = reader.result;
    const base64 = dataUrl.split(',')[1];
    uploadedImage = { base64, mediaType: file.type || 'image/png' };
    document.getElementById('uploadPreview').src = dataUrl;
    document.getElementById('uploadPreview').style.display = 'block';
    document.getElementById('uploadEmpty').style.display = 'none';
    document.getElementById('clearImageBtn').style.display = 'inline-flex';
  };
  reader.readAsDataURL(file);
});

document.getElementById('clearImageBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  uploadedImage = null;
  document.getElementById('imageInput').value = '';
  document.getElementById('uploadPreview').style.display = 'none';
  document.getElementById('uploadEmpty').style.display = 'block';
  document.getElementById('clearImageBtn').style.display = 'none';
});

// ---------- analyze ----------
document.getElementById('analyzeBtn').addEventListener('click', analyzeText);

async function analyzeText(){
  const errBox = document.getElementById('analyzeError');
  const resultBox = document.getElementById('analyzeResult');
  errBox.innerHTML = '';

  const usingImage = analyzeMode === 'image';
  const usingPaste = analyzeMode === 'paste';
  const text = document.getElementById('inputText').value.trim();
  const pasteText = document.getElementById('inputPaste').value.trim();

  if(usingImage && !uploadedImage){
    errBox.innerHTML = '<div class="error-box">먼저 스크린샷을 올려주세요.</div>';
    return;
  }
  if(analyzeMode==='text' && !text){
    errBox.innerHTML = '<div class="error-box">분석할 문장을 먼저 붙여넣어 주세요.</div>';
    return;
  }
  if(usingPaste && !pasteText){
    errBox.innerHTML = '<div class="error-box">단축어 결과 텍스트를 먼저 붙여넣어 주세요.</div>';
    return;
  }

  // paste mode: parse locally, no API call needed
  if(usingPaste){
    try{
      const parsed = parseShortcutResult(pasteText);
      if(!parsed.words.length){
        errBox.innerHTML = '<div class="error-box">단어를 찾지 못했어요. "한자 / 병음 / 뜻" 형식의 줄이 포함된 결과인지 확인해 주세요.</div>';
        return;
      }
      currentResult = { sourceText: parsed.sourceText, translation: parsed.translation, words: parsed.words.map(w=>({...w, added:false})) };
      renderAnalyzeResult();
    }catch(e){
      console.error(e);
      errBox.innerHTML = '<div class="error-box">파싱에 실패했어요. 텍스트 형식을 확인해 주세요.</div>';
    }
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '분석 중<span class="loading-dots"><span></span><span></span><span></span></span>';
  resultBox.innerHTML = '';

  try{
    const baseInstructions = `너는 중국어를 배우는 한국인 학습자를 돕는 번역/분절 도우미야.
입력은 샤오홍슈(小红书)에서 가져온 중국어 문장, 캡션, 또는 그 화면 스크린샷이야.
아래 JSON 형식으로만 답해. 마크다운 코드블록이나 다른 설명 없이 순수 JSON만 출력해.

{
  "sourceText": "원문에서 인식/추출한 중국어 텍스트 전체 (스크린샷이면 화면 속 캡션·댓글 등 학습할 만한 본문 텍스트만, UI 요소나 계정명은 제외)",
  "translation": "sourceText의 자연스러운 한국어 번역",
  "words": [
    {"hanzi": "sourceText에 실제로 등장하는 정확한 부분 문자열", "pinyin": "성조 포함 병음", "meaning": "간결한 한국어 뜻", "note": "학습에 도움되는 짧은 참고 (문법/뉘앙스, 없으면 빈 문자열)"}
  ]
}

규칙:
- words는 의미 단위(단어/숙어)로 쪼개. 단독으로 쓰일 수 없는 조사성 글자나 순수 구두점은 제외.
- 해시태그(#로 시작하는 부분)는 # 기호는 빼고 단어 자체는 학습 단어로 포함시켜.
- hanzi 필드는 반드시 sourceText에 등장하는 정확한 substring이어야 해.
- 같은 단어가 여러 번 나와도 한 번만 포함해.`;

    let userContent;
    if(usingImage){
      userContent = [
        { type: "image", source: { type: "base64", media_type: uploadedImage.mediaType, data: uploadedImage.base64 } },
        { type: "text", text: "이 스크린샷 속 중국어 텍스트를 인식해서 위 형식대로 분석해줘." }
      ];
    }else{
      userContent = text;
    }

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: baseInstructions,
        messages: [{ role: "user", content: userContent }]
      })
    });

    const data = await response.json();
    const textBlock = (data.content || []).find(c => c.type === 'text');
    if(!textBlock) throw new Error('응답을 읽을 수 없어요');
    let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(clean);

    if(!parsed.words || parsed.words.length===0){
      errBox.innerHTML = '<div class="error-box">중국어 텍스트를 찾지 못했어요. 캡션이 잘 보이는 화면으로 다시 시도해 주세요.</div>';
      return;
    }

    currentResult = { sourceText: parsed.sourceText || text, translation: parsed.translation, words: parsed.words.map(w=>({...w, added:false})) };
    renderAnalyzeResult();
  }catch(e){
    console.error(e);
    errBox.innerHTML = '<div class="error-box">분석에 실패했어요. 다시 시도하거나 텍스트로 붙여넣어 보세요.</div>';
  }finally{
    btn.disabled = false;
    btn.innerHTML = '문장 분석하기';
  }
}

function renderAnalyzeResult(){
  const resultBox = document.getElementById('analyzeResult');
  if(!currentResult){ resultBox.innerHTML=''; return; }

  let html = '';
  if(analyzeMode === 'image' || analyzeMode === 'paste'){
    html += `<div class="translation-block" style="border-left-color:var(--red);"><span class="label">인식된 원문</span><span class="zh">${escapeHtml(currentResult.sourceText)}</span></div>`;
  }
  html += `<div class="translation-block"><span class="label">전체 번역</span>${escapeHtml(currentResult.translation)}</div>`;
  html += `<div class="result-actions"><span class="count">단어 ${currentResult.words.length}개</span><button class="ghost-btn" id="addAllBtn">모두 담기</button></div>`;
  html += `<div id="wordCardList">`;
  currentResult.words.forEach((w, i)=>{
    html += renderWordCard(w, i);
  });
  html += `</div>`;
  resultBox.innerHTML = html;

  document.getElementById('addAllBtn').addEventListener('click', ()=>{
    currentResult.words.forEach((w,i)=>{ if(!w.added) addWordToVocab(w,i); });
  });
  resultBox.querySelectorAll('.add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.idx);
      addWordToVocab(currentResult.words[i], i);
    });
  });
  resultBox.querySelectorAll('.speak-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> speak(btn.dataset.hanzi));
  });
}

function renderWordCard(w, i){
  return `
  <div class="word-card ${w.added?'added':''}" id="wcard-${i}">
    <div class="word-top">
      <div style="flex:1;min-width:0;">
        <div class="word-hanzi-row">
          <span class="word-hanzi zh">${escapeHtml(w.hanzi)}</span>
          <span class="word-pinyin">${escapeHtml(w.pinyin)}</span>
        </div>
        <div class="word-meaning">${escapeHtml(w.meaning)}</div>
        ${w.note ? `<div class="word-note">${escapeHtml(w.note)}</div>` : ''}
      </div>
      <div class="word-controls">
        <button class="icon-btn speak-btn" data-hanzi="${escapeHtml(w.hanzi)}" title="발음 듣기">🔊</button>
        <button class="add-btn ${w.added?'added':''}" data-idx="${i}">${w.added?'담음 ✓':'담기'}</button>
      </div>
    </div>
  </div>`;
}

function addWordToVocab(w, idx){
  if(w.added) return;
  const exists = vocab.some(v=>v.hanzi===w.hanzi);
  if(!exists){
    vocab.push({
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      hanzi: w.hanzi,
      pinyin: w.pinyin,
      meaning: w.meaning,
      note: w.note||'',
      sourceText: currentResult.sourceText,
      sourceTranslation: currentResult.translation,
      box: 0,
      nextReview: Date.now(),
      addedAt: Date.now()
    });
    saveVocab();
  }
  w.added = true;
  const card = document.getElementById('wcard-'+idx);
  if(card){
    card.classList.add('added');
    const addBtn = card.querySelector('.add-btn');
    addBtn.classList.add('added');
    addBtn.textContent = '담음 ✓';
  }
  refreshBadges();
}

// ---------- vocab list ----------
document.getElementById('vocabSearch').addEventListener('input', renderVocabList);

function renderVocabList(){
  const listEl = document.getElementById('vocabList');
  const q = document.getElementById('vocabSearch').value.trim().toLowerCase();
  const total = vocab.length;
  const due = vocab.filter(isDue).length;
  const mastered = vocab.filter(v=>v.box>=5).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDue').textContent = due;
  document.getElementById('statMastered').textContent = mastered;

  const filtered = vocab
    .slice()
    .sort((a,b)=>b.addedAt-a.addedAt)
    .filter(v => !q || v.hanzi.includes(q) || v.pinyin.toLowerCase().includes(q) || v.meaning.toLowerCase().includes(q));

  if(filtered.length===0){
    listEl.innerHTML = `<div class="empty-state"><div class="glyph">红</div><p>${total===0 ? '아직 담은 단어가 없어요.<br>분석 탭에서 문장을 붙여넣어 보세요.' : '검색 결과가 없어요.'}</p></div>`;
    return;
  }

  listEl.innerHTML = filtered.map(v=>{
    let dots = '';
    for(let i=0;i<5;i++){ dots += `<span class="${i<v.box?'filled':''}"></span>`; }
    return `
    <div class="vocab-item">
      <div class="vi-main">
        <span class="vi-hanzi zh">${escapeHtml(v.hanzi)}</span><span class="vi-pinyin">${escapeHtml(v.pinyin)}</span>
        <div class="vi-meaning">${escapeHtml(v.meaning)}</div>
        <div class="box-dots">${dots}</div>
      </div>
      <button class="vi-del" data-id="${v.id}">×</button>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.vi-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      vocab = vocab.filter(v=>v.id!==btn.dataset.id);
      saveVocab();
      renderVocabList();
      refreshBadges();
    });
  });
}

// ---------- review ----------
function startReview(){
  reviewQueue = vocab.filter(isDue).sort((a,b)=>a.nextReview-b.nextReview);
  reviewIndex = 0;
  reviewDoneCount = 0;
  renderReview();
}

function renderReview(){
  const area = document.getElementById('reviewArea');
  if(reviewQueue.length===0){
    area.innerHTML = `<div class="empty-state"><div class="glyph">红</div><p>오늘 복습할 단어가 없어요.<br>분석 탭에서 새 단어를 담아보세요.</p></div>`;
    return;
  }
  if(reviewIndex >= reviewQueue.length){
    area.innerHTML = `
    <div class="done-screen">
      <div class="glyph">红</div>
      <h2>오늘의 복습 완료</h2>
      <p>${reviewDoneCount}개 단어를 복습했어요.</p>
    </div>`;
    refreshBadges();
    return;
  }
  const card = reviewQueue[reviewIndex];
  area.innerHTML = `
    <div class="review-progress"><span>복습 중</span><span>${reviewIndex+1} / ${reviewQueue.length}</span></div>
    <div class="review-track"><div style="width:${(reviewIndex/reviewQueue.length)*100}%"></div></div>
    <div class="flashcard" id="flashcard">
      <div class="fc-front">
        <div class="fc-hanzi zh">${escapeHtml(card.hanzi)}</div>
        <div class="fc-pinyin">${escapeHtml(card.pinyin)}</div>
        <div class="fc-speak" id="fcSpeak" title="발음 듣기">🔊</div>
        <div class="fc-hint">탭해서 뜻 확인</div>
      </div>
      <div class="fc-back">
        <div class="fc-meaning">${escapeHtml(card.meaning)}</div>
        ${card.note ? `<div class="word-note" style="margin-bottom:6px;">${escapeHtml(card.note)}</div>` : ''}
        <div class="fc-source">${escapeHtml(card.sourceText)}</div>
      </div>
    </div>
    <div class="review-actions" id="reviewActions" style="visibility:hidden;">
      <button class="btn-again" id="btnAgain">모르겠어요</button>
      <button class="btn-know" id="btnKnow">알아요</button>
    </div>
  `;

  const fc = document.getElementById('flashcard');
  fc.addEventListener('click', (e)=>{
    if(e.target.id==='fcSpeak') return;
    fc.classList.add('flipped');
    document.getElementById('reviewActions').style.visibility = 'visible';
  });
  document.getElementById('fcSpeak').addEventListener('click', (e)=>{
    e.stopPropagation();
    speak(card.hanzi);
  });
  document.getElementById('btnAgain').addEventListener('click', ()=> submitReview(card, false));
  document.getElementById('btnKnow').addEventListener('click', ()=> submitReview(card, true));
}

function submitReview(card, correct){
  markResult(card, correct);
  saveVocab();
  reviewDoneCount++;
  reviewIndex++;
  renderReview();
}

// ---------- shortcut result parser (local, no API) ----------
function extractSection(raw, label){
  const re = new RegExp('▶\\s*' + label + '\\s*\\n+([\\s\\S]*?)(?:\\n---|\\n▶|$)');
  const m = raw.match(re);
  return m ? m[1].trim() : '';
}

function parseShortcutResult(raw){
  const sourceText = extractSection(raw, '본문 원문') || extractSection(raw, '사진 속 텍스트') || '';
  const translation = extractSection(raw, '한국어 번역') || '';

  const lines = raw.split(/\r?\n/);
  const words = [];
  const seen = new Set();

  for(const rawLine of lines){
    const line = rawLine.trim();
    if(!line || line.length < 2) continue;

    // support both "한자|병음|뜻" and "한자 / 병음 / 뜻"
    let parts;
    if(line.includes('|')){
      parts = line.split('|').map(p=>p.trim()).filter(p=>p.length>0);
    }else{
      parts = line.split('/').map(p=>p.trim()).filter(p=>p.length>0);
    }
    if(parts.length < 3) continue;

    const hanzi = parts[0];
    const meaning = parts[parts.length-1];
    const pinyin = parts.slice(1, parts.length-1).join(' ');

    const hasCJK = /[\u4e00-\u9fff]/.test(hanzi);
    const pinyinHasCJKorHangul = /[\u4e00-\u9fff\uac00-\ud7a3]/.test(pinyin);
    if(!hasCJK || pinyinHasCJKorHangul || !pinyin || !meaning) continue;
    if(seen.has(hanzi)) continue;
    seen.add(hanzi);
    words.push({ hanzi, pinyin, meaning, note: '' });
  }

  return {
    sourceText: sourceText || (words.length ? `단어 ${words.length}개` : raw.slice(0,150)),
    translation,
    words
  };
}

// ---------- utils ----------
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ---------- auto-import from URL (?data=... from the Shortcut) ----------
function tryAutoImportFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('data');
  if(!raw) return;

  const parsed = parseShortcutResult(raw);
  let addedCount = 0;
  parsed.words.forEach(w=>{
    if(!vocab.some(v=>v.hanzi===w.hanzi)){
      vocab.push({
        id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
        hanzi: w.hanzi,
        pinyin: w.pinyin,
        meaning: w.meaning,
        note: w.note||'',
        sourceText: parsed.sourceText,
        sourceTranslation: parsed.translation,
        box: 0,
        nextReview: Date.now(),
        addedAt: Date.now()
      });
      addedCount++;
    }
  });
  if(addedCount>0) saveVocab();

  // clean the URL so refreshing doesn't re-import
  history.replaceState(null, '', window.location.pathname);

  // jump to vocab tab and show a quick confirmation banner
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="vocab"]').classList.add('active');
  document.getElementById('panel-vocab').classList.add('active');
  renderVocabList();
  refreshBadges();

  const banner = document.createElement('div');
  if(parsed.words.length === 0){
    banner.style.cssText = 'margin-bottom:14px;padding:12px 14px;background:var(--red-tint);border-left:3px solid var(--red);font-size:12.5px;color:var(--red-deep);line-height:1.6;word-break:break-all;';
    banner.textContent = '단어를 못 읽었어요. 받은 내용: ' + raw.slice(0,120);
  }else{
    banner.style.cssText = 'margin-bottom:14px;padding:12px 14px;background:var(--sage-tint);border-left:3px solid var(--sage);font-size:13px;color:var(--sage);font-weight:600;';
    banner.textContent = addedCount>0 ? `${addedCount}개 단어가 저장됐어요.` : '이미 저장된 단어들이에요.';
  }
  const panel = document.getElementById('panel-vocab');
  panel.insertBefore(banner, panel.firstChild);
}

// ---------- init ----------
(async function init(){
  await loadVocab();
  refreshBadges();
  tryAutoImportFromUrl();
})();
</script>
